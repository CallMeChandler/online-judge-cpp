<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Online Judge</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 40px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 8px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        .problem {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-top: 12px;
        }

        .difficulty {
            display: inline-block;
            margin-top: 8px;
            color: green;
            font-weight: bold;
        }

        button {
            margin-top: 18px;
            padding: 10px 16px;
            border: none;
            background: black;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            opacity: .9;
        }
    </style>
</head>

<body>

    <h1>LeetCode Online Judge</h1>
    <p>Production-inspired C++ backend</p>

    <button onclick="loadProblems()">
        Load Problems
    </button>

    <div id="problem-list" class="card">
        <h2>Problems</h2>
        <p>Click the button to fetch problems.</p>
    </div>

    <script>
        async function loadProblems() {

            const response = await fetch("/problems");
            const problems = await response.json();

            const container = document.getElementById("problem-list");

            container.innerHTML = "<h2>Problems</h2>";

            problems.forEach(problem => {

                const div = document.createElement("div");
                div.className = "problem";

                div.innerHTML = `
          <h3>${problem.id}. ${problem.title}</h3>
          <p>${problem.description}</p>
          <span class="difficulty">${problem.difficulty}</span>
        `;

                container.appendChild(div);
            });
        }
    </script>

</body>

</html>
